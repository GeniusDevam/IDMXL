[workspace]
members = ["crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
curl = { version = "0.4.51", features = ["static-curl", "http2"] }
ctrlc = "3.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
httpdate = "1.0"
percent-encoding = "2.3.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
url = "2.5"
uuid = { version = "1.17", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

